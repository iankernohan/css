<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nacho and Nugget</title>
    <link rel="stylesheet" href="../node_modules/aba-css/dist/index.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <button id="button-left">Left</button>
    <button id="button-right">Right</button>
    <button id="button-up">Up</button>
    <button id="button-down">Down</button>
    <button id="button-zoom-in">+</button>
    <button id="button-zoom-out">-</button>
    <input type="range" id="zoom-range" name="zoom-range" min="2" max="40" />
    <span id="x-display"></span>
    <span id="z-display"></span>
    <div class="scene">
      <div id="nacho__and__nugget" draggable="true">
        <div id="nacho">
          <div class="cube nacho__head">
            <div></div>
          </div>
          <div class="cube nacho__eye nacho__eye-left">
            <div></div>
          </div>
          <div class="cube nacho__eye nacho__eye-right">
            <div></div>
          </div>
          <div class="cube nacho__body">
            <div></div>
          </div>
          <div class="cube nacho__beak">
            <div></div>
          </div>
          <div class="cube nacho__gobble">
            <div></div>
          </div>
          <div class="cube nacho__wing nacho__wing-right">
            <div></div>
          </div>
          <div class="cube nacho__wing nacho__wing-left">
            <div></div>
          </div>
          <div class="cube nacho__leg nacho__leg-right">
            <div></div>
          </div>
          <div class="cube nacho__leg nacho__leg-left">
            <div></div>
          </div>
          <div class="cube nacho__foot nacho__foot-right">
            <div></div>
          </div>
          <div class="cube nacho__foot nacho__foot-left">
            <div></div>
          </div>
          <div class="cube nacho__toe nacho__toe-right">
            <div></div>
          </div>
          <div class="cube nacho__toe nacho__toe-left">
            <div></div>
          </div>
        </div>
        <div id="nugget">
          <div class="cube nugget__head">
            <div>
              <div class="cube nugget__eyebrow">
                <div></div>
              </div>
              <div class="cube nugget__eye nugget__eye-left">
                <div></div>
              </div>
              <div class="cube nugget__eye nugget__eye-right">
                <div></div>
              </div>
              <div class="cube nugget__nose">
                <div></div>
              </div>
              <div class="cube nugget__mouth">
                <div></div>
              </div>
            </div>
          </div>
          <div class="cube nugget__body">
            <div>
              <div class="cube nugget__shoulder nugget__shoulder-left">
                <div>
                  <div class="cube nugget__arm nugget__arm-left">
                    <div></div>
                  </div>
                </div>
              </div>
              <div class="cube nugget__shoulder nugget__shoulder-right">
                <div>
                  <div class="cube nugget__arm nugget__arm-right">
                    <div></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
  <script src="index.js"></script>
</html>
